#No touchey
messagesVersion: 15

#Added to the start of most messages
Prefix: "&b&lccRides &1» "

#Ride Messages
Ride:
  queue:
    joined: "&9Du bist der Warteschlange von {ride} beigetreten. &b{place} &9Spieler sind vor dir.\n&9Benutze &7/ride lq&9 um die Warteschlange zu verlassen."
    joinedFast: "&9Du bist der Express-Warteschlange von {ride} beigetreten. &b{place} &9Spieler sind vor dir.\n&9Benutze &7/ride lq&9 um die Warteschlange zu verlassen."
    already: "&9Du bist bereits in der Warteschlange. \n&9Du bist auf Platz &b{place} von {total}."
    alreadyOther: "&9Du stehst bereits für {ride} an. \n&9Benutze &7/ride lq &9um die Warteschlange zu verlassen."
    onRide: "&9Du kannst keiner Warteschlange beitreten, während du auf einer Fahrt bist. \n&9Benutze &7/ride exit&9 um die Fahrt zu verlassen."
    left: "&9Du hast die Warteschlange von {ride} verlassen."
  cantAfford: "&cDu hast nicht genug &6Tokens&c für diese Fahrt! \n&cKomm zurück, wenn du mindestens &6{price} Tokens&c hast."
  paid: "&9Du hast &6{price} Tokens&9 bezahlt, um mit {ride} zu fahren."
  noPermission: "&cDu hast keine Berechtigung für diese Fahrt! :("
  seatTaken: "&cDieser Sitz ist bereits belegt!"
  full: "&cDie Fahrt ist voll, bitte warte bis sie beendet ist, bevor du beitrittst."
  running: "&cDie Fahrt läuft bereits, bitte warte bis sie beendet ist, bevor du beitrittst."
  starting:
    needMoreRiders: "&9Warten auf {count} weitere Spieler, um zu starten."
    countdown: "&9Die Fahrt beginnt in {time} Sekunden."
    seatsFull: "&9Alle Sitze sind belegt! Fahrt startet."
  Jets:
    controlMessage: "&b&lJets &1&l» &b&lSteuere die Höhe mit dem Mausrad."

#Messages used for PlaceholderAPI messages
Placeholder:
  enabled: "Aktiviert"
  disabled: "Deaktiviert"
  waiting: "Wartend"
  startingSoon: "Startet gleich"
  running: "In Betrieb"
  rideNotExist: "Fehler: RideID {RIDE} existiert nicht."
  unlimitedPasses: "Unbegrenzt"

#Command Messages
Command:
  #general command messages
  notPlayer: "&cDieser Befehl muss von einem Spieler ausgeführt werden."
  notEnabled: "&cRide-Befehle sind deaktiviert!"
  noPermission: "&cDu hast keine Berechtigung dafür!"
  listRides: "&9Verfügbare Fahrten sind: \n{ridelist}"
  rideNotExist: "&cDiese Fahrt existiert nicht."
  playerNotExist: "&cKonnte keinen Spieler mit diesem Namen finden. Ist er online?"

  #player command messages
  Player:
    help:  "&1&m–------–––&b ccRides Hilfe: &1&m––------––\n
            &7/ride &8[&7name&8]&9 - Eine Fahrt benutzen\n
            &7/ride exit&9 - Eine Fahrt vor dem Ende verlassen\n
            &7/ride lq&9 - Eine Fahrt-Warteschlange verlassen\n
            &7/ride list&9 - Eine Liste aller Fahrten anzeigen\n
            &7/ride help&9 - Diese Hilfe anzeigen\n
            &1&m------------------------------------------"
    exit:
      main: "&9Du hast {ride} verlassen"
      notRiding: "&9Du bist auf keiner Fahrt."
    leaveQueue:
      main: "&9Du hast die Warteschlange für {ride} verlassen"
      notQueing: "&9Du stehst in keiner Warteschlange"

  #admin command messages
  Admin:
    help: "&4&m–––----–&c ccRides Admin Hilfe: &4&m––----––\n
          &cAliases: &7/rideadmin /rideadm\n
          &7/rideadm help &c- Hilfe anzeigen\n
          &7/rideadm reload &8<&7all&8|&7rideName&8> &c- Eine Fahrt oder alles neu laden\n
          &7/rideadm create &8<&7rideName&8> <&7rideType&8> &c- Eine neue Fahrt erstellen\n
          &7/rideadm delete &8<&7rideName&8> &c- Eine Fahrt löschen\n
          &7/rideadm linksign &8<&7rideName&8> &c- Ein Schild mit einer Fahrt verknüpfen\n
          &7/rideadm unlinksign &c- Die Verknüpfung eines Schilds mit einer Fahrt aufheben\n
          &7/rideadm list &c- Eine Liste aller Fahrten anzeigen\n
          &7/rideadm &8<&7name&8> <&7info&8|&7reload&8|&7enable&8|&7disable&8>\n
          &7/rideadm &8<&7name&8> &7setting &8<&7key&8> <&7value&8> &c- Fahrt-Einstellungen ändern.\n
          &7/rideadm &8<&7name&8> &7ejectPlayer &8<&7rider&8> &c- Einen Fahrer herauswerfen.\n
      &4&m------------------------------------------------"
    forceRide:
      all: "&9Alle Spieler fahren jetzt mit {ride}."
      single: "&9{player} wird gezwungen, mit {ride} zu fahren."
    reload:
      all: "&9Plugin wird neu geladen"
      ride:  "&9Fahrt {ride} wird neu geladen"
    createRide:
      main: "&9Neue Fahrt erstellt: {ride} Typ: {type}"
      exists: "&c{ride} existiert bereits"
      syntax: "&cFehlende/Falsche Argumente! \n
              &cVerwendung &7/rideadm create <name> <type>\n
              &cVerfügbare Fahrttypen: {types}"
    deleteRide:
      main: "&9Fahrt {ride} gelöscht"
      syntax: "&cFehlende Argumente! \n
              &cVerwendung &7/rideadm delete <name>"
    Ride:
      enable:
        main: "&9{ride} wurde aktiviert"
        fail: "&c{ride} konnte nicht aktiviert werden. \n
              &cBitte überprüfe, ob alle Einstellungen korrekt sind."
